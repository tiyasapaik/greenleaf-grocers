<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — GreenLeaf Grocers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #52b788 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: white; border-radius: 20px; padding: 2.5rem 3rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 420px; width: 100%; }
        .login-brand { text-align: center; margin-bottom: 2rem; }
        .login-brand .logo { font-size: 3rem; }
        .login-brand h2 { color: #1b4332; font-weight: 700; margin: 0.3rem 0 0; }
        .login-brand small { color: #6c757d; font-size: 0.85rem; }
        .form-control:focus { border-color: #2d6a4f; box-shadow: 0 0 0 0.2rem rgba(45,106,79,0.2); }
        .btn-login { background: #2d6a4f; color: white; border: none; width: 100%; padding: 0.75rem; border-radius: 10px; font-weight: 600; font-size: 1rem; }
        .btn-login:hover { background: #1b4332; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-center">
        <div class="login-card">
            <div class="login-brand">
                <div class="logo">🌿</div>
                <h2>GreenLeaf Grocers</h2>
                <small>Inventory & Sales Management System</small>
            </div>
            {% if form.errors %}
            <div class="alert alert-danger">Invalid username or password. Please try again.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username" autofocus required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-login">🔐 Sign In</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Default Admin: <strong>admin</strong> / <strong>admin123</strong><br>Default Cashier: <strong>cashier</strong> / <strong>cashier123</strong></small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
